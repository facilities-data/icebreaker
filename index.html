<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Christmas Team Icebreakers & Shuffler</title>
<style>
  :root {
    --red: #b91c1c;
    --dark-red: #7f1d1d;
    --green: #15803d;
    --dark-green: #14532d;
    --gold: #f59e0b;
    --light-gold: #fef3c7;
    --cream: #fffbeb;
    --bg: #0f172a;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  body {
    background: radial-gradient(circle at top, #0f766e, #042f2e);
    color: #f8fafc;
    min-height: 100vh;
    padding: 24px;
    position: relative;
    isolation: isolate;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    opacity: 0.55;
    background-image:
      radial-gradient(2px 2px at 12% 18%, #fff7cc 99%, transparent),
      radial-gradient(1.5px 1.5px at 82% 12%, #ffffff 99%, transparent),
      radial-gradient(2px 2px at 66% 44%, #fef3c7 99%, transparent),
      radial-gradient(1px 1px at 25% 70%, #ffffff 99%, transparent),
      radial-gradient(2px 2px at 92% 82%, #fff7cc 99%, transparent),
      radial-gradient(1.5px 1.5px at 48% 92%, #ffffff 99%, transparent);
    background-size: 240px 220px;
    animation: glitter-twinkle 3s ease-in-out infinite alternate;
  }

  @keyframes glitter-twinkle {
    from { opacity: 0.25; }
    to { opacity: 0.8; }
  }

  @media (prefers-reduced-motion: reduce) {
    body::before { animation: none; }
  }

  header {
    text-align: center;
    margin-bottom: 24px;
  }

  header h1 {
    font-size: 2rem;
    color: var(--gold);
    text-shadow: 0 2px 10px rgba(245, 158, 11, 0.3);
    margin-bottom: 8px;
  }

  header p {
    color: #cbd5e1;
    font-size: 0.95rem;
  }

  .controls-bar {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 14px;
    flex-wrap: wrap;
  }

  button {
    cursor: pointer;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-weight: 600;
    font-size: 0.9rem;
    transition: transform 0.15s ease, background-color 0.2s ease;
  }

  button:active {
    transform: scale(0.96);
  }

  .btn-primary {
    background: var(--green);
    color: white;
    box-shadow: 0 4px 12px rgba(21, 128, 61, 0.4);
  }

  .btn-primary:hover {
    background: #16a34a;
  }

  .btn-secondary {
    background: #334155;
    color: #f8fafc;
  }

  .btn-secondary:hover {
    background: #475569;
  }

  .btn-gold {
    background: var(--gold);
    color: #1e293b;
    box-shadow: 0 4px 12px rgba(245, 158, 11, 0.35);
  }

  .btn-gold:hover {
    background: #fbbf24;
  }

  .main-layout {
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 24px;
    max-width: 1400px;
    margin: 0 auto;
    align-items: start;
  }

  @media (max-width: 960px) {
    .main-layout {
      grid-template-columns: 1fr;
    }
  }

  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 16px;
  }

  .card {
    perspective: 1200px;
    height: 230px;
    cursor: pointer;
  }

  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    text-align: center;
    transition: transform 0.85s cubic-bezier(0.22, 0.75, 0.25, 1);
    transform-style: preserve-3d;
    transform-origin: center;
    will-change: transform;
  }

  .card:hover:not(.flipped) .card-inner {
    transform: translateY(-6px) rotateY(-7deg) rotateX(2deg);
  }

  .card.flipped .card-inner {
    transform: rotateY(180deg);
  }

  .card.flipped:hover .card-inner {
    transform: rotateY(180deg);
  }

  .card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 18px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
  }

  .card-back {
    background: repeating-linear-gradient(
      45deg,
      var(--red),
      var(--red) 14px,
      var(--dark-red) 14px,
      var(--dark-red) 28px
    );
    border: 3px solid var(--gold);
    color: var(--light-gold);
  }

  .card-back-badge {
    background: var(--dark-green);
    border: 2px solid var(--gold);
    border-radius: 50%;
    width: 72px;
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    margin-bottom: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.4);
  }

  .card-number {
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 1px;
    background: rgba(0, 0, 0, 0.45);
    padding: 4px 12px;
    border-radius: 20px;
  }

  .card-front {
    background: var(--cream);
    color: #1e293b;
    border: 3px solid var(--green);
    transform: rotateY(180deg);
    justify-content: space-between;
  }

  .card-front-header {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--red);
  }

  .card-question {
    font-size: 1.02rem;
    font-weight: 600;
    line-height: 1.4;
    color: #0f172a;
  }

  .card-front-footer {
    font-size: 0.75rem;
    color: var(--green);
    font-weight: 600;
  }

  .shuffler-panel {
    background: radial-gradient(circle at top, #0f766e, #042f2e);
    border: 2px solid var(--gold);
    border-radius: 16px;
    padding: 20px;
    position: sticky;
    top: 24px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
  }

  .shuffler-panel h2 {
    color: var(--gold);
    font-size: 1.25rem;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .shuffler-panel p.sub {
    font-size: 0.85rem;
    color: #94a3b8;
    margin-bottom: 14px;
  }

  .shuffler-panel .controls-bar {
    margin: 0 0 14px;
  }

  .shuffler-panel .controls-bar button {
    flex: 1;
    padding: 10px 8px;
    font-size: 0.8rem;
    white-space: nowrap;
  }

  .input-group {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }

  input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #475569;
    background: #0f172a;
    color: white;
    font-size: 0.9rem;
  }

  input[type="text"]:focus {
    outline: none;
    border-color: var(--gold);
  }

  .winner-box {
    background: linear-gradient(135deg, var(--dark-green), var(--green));
    border: 2px solid var(--gold);
    border-radius: 12px;
    padding: 16px;
    text-align: center;
    margin-bottom: 14px;
    min-height: 90px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .winner-label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--light-gold);
    margin-bottom: 4px;
  }

  .winner-name {
    font-size: 1.5rem;
    font-weight: 800;
    color: #ffffff;
  }

  .shuffler-actions {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .shuffler-actions button {
    flex: 1;
  }

  .list-section {
    margin-top: 12px;
  }

  .list-header {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    font-weight: 700;
    color: #cbd5e1;
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  .tag-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    max-height: 140px;
    overflow-y: auto;
  }

  .name-tag {
    background: #334155;
    color: #f8fafc;
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 0.85rem;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .name-tag span.remove {
    cursor: pointer;
    color: #f87171;
    font-weight: bold;
  }

  .name-tag.eliminated {
    background: #0f172a;
    color: #64748b;
    text-decoration: line-through;
    border: 1px solid #334155;
  }
</style>
</head>
<body>

<header>
  <h1>🎄 Christmas Team Icebreakers 🎁</h1>
  <p>Pick a teammate on the right, then click any festive card to reveal their question!</p>
</header>

<div class="main-layout">
  <div class="cards-grid" id="cardsGrid"></div>

  <aside class="shuffler-panel">
    <h2>🎅 Who's Next?</h2>
    <p class="sub">Add teammates below. Picked names are automatically eliminated until reset.</p>

    <div class="controls-bar">
      <button class="btn-primary" onclick="shuffleCards()">🔀 Shuffle Cards</button>
      <button class="btn-secondary" onclick="resetCards()">🔄 Flip All Back</button>
    </div>

    <div class="input-group">
      <input type="text" id="nameInput" placeholder="Enter teammate name..." onkeypress="handleEnter(event)">
      <button class="btn-primary" onclick="addName()">Add</button>
    </div>

    <div class="winner-box">
      <div class="winner-label">Selected to Answer</div>
      <div class="winner-name" id="winnerDisplay">—</div>
    </div>

    <div class="shuffler-actions">
      <button class="btn-gold" id="pickBtn" onclick="pickRandomTeammate()">🎲 Pick Next</button>
      <button class="btn-secondary" onclick="resetPool()">↺ Reset Pool</button>
    </div>

    <div class="list-section">
      <div class="list-header">
        <span>Remaining Pool</span>
        <span id="remainingCount">0</span>
      </div>
      <div class="tag-list" id="activeList"></div>
    </div>

    <div class="list-section" style="margin-top: 16px; border-top: 1px solid #334155; padding-top: 12px;">
      <div class="list-header">
        <span>Already Answered</span>
        <span id="eliminatedCount">0</span>
      </div>
      <div class="tag-list" id="eliminatedList"></div>
    </div>
  </aside>
</div>
<script>
  const initialQuestions = [
    "What is one dish or dessert that MUST be on your table for Christmas dinner?",
    "What is your all-time favorite Christmas song that you secretly love singing along to?",
    "Are you an early gift shopper or a last-minute Christmas Eve rush shopper?",
    "What is the funniest or most unexpected exchange gift you have ever received?",
    "If you could invite any fictional holiday character to our team party, who would it be?",
    "What is a favorite holiday tradition your family or friends celebrate every year?",
    "Do you prefer opening gifts right at midnight on Christmas Eve or waiting until morning?",
    "What is your go-to Christmas movie that you watch every single year?",
    "If you could teleport anywhere in the world for Christmas vacation, where would you go?",
    "What is one small win or highlight from this year that you are proud of?",
    "Which holiday decoration is your favorite: twinkling lights, the Christmas tree, or parols/stars?",
    "If you had to eat only one holiday treat for the rest of December, what would it be?",
    "What is the best gift you have ever given to someone else?",
    "What is your favorite way to relax and recharge during the holiday break?",
    "If our team had a holiday talent show, what act would you perform?",
    "What is one fun goal or wish you are looking forward to in the new year?"
  ];

  const icons = ["🎄", "🎁", "⭐", "🔔", "🕯️", "🦌", "🎅", "🎶", "🍪", "✨", "🎉", "🎀", "🥂", "🌟", "🥁", "❤️"];

  let cardsData = initialQuestions.map((q, idx) => ({
    question: q,
    icon: icons[idx % icons.length],
    audio: `audio/card-${idx + 1}.mp3`,
    flipped: false
  }));
  let isShufflingCards = false;
  let soundContext;
  let currentVoiceover = null;

  function playVoiceover(audioPath) {
    stopVoiceover();
    if (!audioPath) return;

    currentVoiceover = new Audio(audioPath);
    currentVoiceover.play().catch(err => {
      console.warn("Could not play audio file:", audioPath, err);
    });
  }

  function stopVoiceover() {
    if (currentVoiceover) {
      currentVoiceover.pause();
      currentVoiceover.currentTime = 0;
      currentVoiceover = null;
    }
  }

  function playUiSound(action) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return;

    soundContext = soundContext || new AudioContextClass();
    if (soundContext.state === "suspended") soundContext.resume();

    if (action === "winner") {
      const now = soundContext.currentTime;
      [
        { frequency: 523, start: 0, duration: 0.18 },
        { frequency: 784, start: 0.2, duration: 0.48 }
      ].forEach(note => {
        const oscillator = soundContext.createOscillator();
        const volume = soundContext.createGain();
        oscillator.type = "triangle";
        oscillator.frequency.setValueAtTime(note.frequency, now + note.start);
        volume.gain.setValueAtTime(0.12, now + note.start);
        volume.gain.exponentialRampToValueAtTime(0.001, now + note.start + note.duration);
        oscillator.connect(volume);
        volume.connect(soundContext.destination);
        oscillator.start(now + note.start);
        oscillator.stop(now + note.start + note.duration);
      });
      return;
    }

    const sounds = {
      flip: { frequency: 620, duration: 0.09, type: "triangle" },
      reset: { frequency: 440, duration: 0.18, type: "sine" },
      shuffle: { frequency: 760, duration: 0.22, type: "sawtooth" },
      roll: { frequency: 500, duration: 0.055, type: "square" },
      winner: { frequency: 880, duration: 0.38, type: "sine" }
    };
    const sound = sounds[action];
    const oscillator = soundContext.createOscillator();
    const volume = soundContext.createGain();
    const now = soundContext.currentTime;

    oscillator.type = sound.type;
    oscillator.frequency.setValueAtTime(sound.frequency, now);
    oscillator.frequency.exponentialRampToValueAtTime(sound.frequency * 0.65, now + sound.duration);
    volume.gain.setValueAtTime(0.12, now);
    volume.gain.exponentialRampToValueAtTime(0.001, now + sound.duration);
    oscillator.connect(volume);
    volume.connect(soundContext.destination);
    oscillator.start(now);
    oscillator.stop(now + sound.duration);
  }

  function renderCards() {
    const grid = document.getElementById("cardsGrid");
    grid.innerHTML = "";
    cardsData.forEach((item, index) => {
      const card = document.createElement("div");
      card.className = item.flipped ? "card flipped" : "card";
      card.onclick = () => toggleCard(index);

      card.innerHTML = `
        <div class="card-inner">
          <div class="card-face card-back">
            <div class="card-back-badge">${item.icon}</div>
            <div class="card-number">CARD #${index + 1}</div>
          </div>
          <div class="card-face card-front">
            <div class="card-front-header">🎄 Holiday Icebreaker #${index + 1}</div>
            <div class="card-question">${item.question}</div>
            <div class="card-front-footer">Click to flip back</div>
          </div>
        </div>
      `;
      grid.appendChild(card);

    });
  }

    function toggleCard(index) {
    if (isShufflingCards) return;
    playUiSound("flip");

    cardsData[index].flipped = !cardsData[index].flipped;
    document.getElementById("cardsGrid").children[index].classList.toggle("flipped", cardsData[index].flipped);

    if (cardsData[index].flipped) {
      playVoiceover(cardsData[index].audio);
    } else {
      stopVoiceover();
    }
  }


  async function shuffleCards() {
    if (isShufflingCards) return;
     stopVoiceover();
    playUiSound("shuffle");

    const grid = document.getElementById("cardsGrid");
    const cards = [...grid.children];
    if (cards.length < 2 || window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      cardsData.forEach(card => card.flipped = false);
      for (let i = cardsData.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cardsData[i], cardsData[j]] = [cardsData[j], cardsData[i]];
      }
      renderCards();
      return;
    }

    isShufflingCards = true;
    grid.style.pointerEvents = "none";
    cardsData.forEach(card => card.flipped = false);
    cards.forEach(card => card.classList.remove("flipped"));

    const gridRect = grid.getBoundingClientRect();
    const centerX = gridRect.left + gridRect.width / 2;
    const centerY = gridRect.top + gridRect.height / 2;

    const gathering = cards.map((card, index) => {
      const rect = card.getBoundingClientRect();
      const x = centerX - (rect.left + rect.width / 2);
      const y = centerY - (rect.top + rect.height / 2);
      const angle = (index % 2 ? 1 : -1) * (8 + index % 5 * 3);
      card.style.zIndex = String(index + 1);
      return card.animate([
        { transform: "translate(0, 0) rotate(0deg) scale(1)" },
        { transform: `translate(${x}px, ${y}px) rotate(${angle}deg) scale(0.38)` }
      ], {
        duration: 520,
        delay: index * 18,
        easing: "cubic-bezier(0.22, 0.75, 0.25, 1)",
        fill: "both"
      }).finished;
    });
    await Promise.all(gathering);

    for (let i = cardsData.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [cardsData[i], cardsData[j]] = [cardsData[j], cardsData[i]];
    }
    renderCards();

    const spreadCards = [...grid.children];
    const spreading = spreadCards.map((card, index) => {
      const rect = card.getBoundingClientRect();
      const x = centerX - (rect.left + rect.width / 2);
      const y = centerY - (rect.top + rect.height / 2);
      const angle = (index % 2 ? 1 : -1) * (8 + index % 5 * 3);
      return card.animate([
        { transform: `translate(${x}px, ${y}px) rotate(${angle}deg) scale(0.38)` },
        { transform: "none" }
      ], {
        duration: 560,
        delay: index * 18,
        easing: "cubic-bezier(0.22, 0.75, 0.25, 1)",
        fill: "both"
      }).finished;
    });
    await Promise.all(spreading);

    isShufflingCards = false; 
    grid.style.pointerEvents = "";
  }

  function resetCards() {
     stopVoiceover();
    playUiSound("reset");
    cardsData.forEach((card, index) => {
      card.flipped = false;
      document.getElementById("cardsGrid").children[index].classList.remove("flipped");
    });
  }

  let activeTeammates = [];
  let eliminatedTeammates = [];
  let isRolling = false;

  function renderTeammates() {
    const activeList = document.getElementById("activeList");
    const eliminatedList = document.getElementById("eliminatedList");
    document.getElementById("remainingCount").textContent = activeTeammates.length;
    document.getElementById("eliminatedCount").textContent = eliminatedTeammates.length;

    activeList.innerHTML = "";
    activeTeammates.forEach((name, idx) => {
      const tag = document.createElement("div");
      tag.className = "name-tag";
      tag.innerHTML = `${name} <span class="remove" title="Remove" onclick="removeName(${idx})">×</span>`;
      activeList.appendChild(tag);
    });

    eliminatedList.innerHTML = "";
    eliminatedTeammates.forEach(name => {
      const tag = document.createElement("div");
      tag.className = "name-tag eliminated";
      tag.textContent = name;
      eliminatedList.appendChild(tag);
    });
  }

  function handleEnter(e) {
    if (e.key === "Enter") addName();
  }

  function addName() {
    const input = document.getElementById("nameInput");
    const raw = input.value.trim();
    if (!raw) return;

    const names = raw.split(",").map(n => n.trim()).filter(n => n.length > 0);
    names.forEach(name => {
      if (!activeTeammates.includes(name) && !eliminatedTeammates.includes(name)) {
        activeTeammates.push(name);
      }
    });

    input.value = "";
    renderTeammates();
  }

  function removeName(index) {
    activeTeammates.splice(index, 1);
    renderTeammates();
  }

  function pickRandomTeammate() {
    if (isRolling) return;
    if (activeTeammates.length === 0) {
      alert("Everyone has had a turn! Click 'Reset Pool' to play another round.");
      return;
    }

    const display = document.getElementById("winnerDisplay");
    if (activeTeammates.length === 1) {
      const chosenName = activeTeammates.pop();
      eliminatedTeammates.push(chosenName);
      display.textContent = "🎉 " + chosenName + " 🎉";
      playUiSound("winner");
      renderTeammates();
      return;
    }

    isRolling = true;
    const pickDuration = 5000;

    let timeout;
    const interval = setInterval(() => {
      if (activeTeammates.length === 0) {
        clearInterval(interval);
        clearTimeout(timeout);
        isRolling = false;
        display.textContent = "—";
        return;
      }

      const tempName = activeTeammates[Math.floor(Math.random() * activeTeammates.length)];
      display.textContent = tempName;
      playUiSound("roll");
    }, 100);

    timeout = setTimeout(() => {
      clearInterval(interval);
      if (activeTeammates.length === 0) {
        isRolling = false;
        display.textContent = "—";
        return;
      }

      const chosenIndex = Math.floor(Math.random() * activeTeammates.length);
      const chosenName = activeTeammates.splice(chosenIndex, 1)[0];
      eliminatedTeammates.push(chosenName);
      display.textContent = "🎉 " + chosenName + " 🎉";
      playUiSound("winner");
      renderTeammates();
      isRolling = false;
    }, pickDuration);
  }

  function resetPool() {
    activeTeammates = [...activeTeammates, ...eliminatedTeammates];
    eliminatedTeammates = [];
    document.getElementById("winnerDisplay").textContent = "—";
    renderTeammates();
  }

  renderCards();
  renderTeammates();
</script>

</body>
</html>
